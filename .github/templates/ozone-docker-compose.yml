version: '3.8'

services:
  ozone:
    image: apache/ozone:1.4.0
    container_name: ozone-test
    hostname: ozone
    ports:
      - "9862:9862"  # Ozone DataNode
      - "9878:9878"  # Ozone Manager
      - "9876:9876"  # Storage Container Manager
    environment:
      - OZONE_OPTS=-Dorg.apache.ratis.thirdparty.io.netty.allocator.useCacheForAllThreads=false
    command: >
      bash -c "
        ozone scm --init 2>/dev/null || true &&
        ozone scm &
        sleep 5 &&
        ozone om --init 2>/dev/null || true &&
        ozone om &
        sleep 5 &&
        ozone datanode
      "
    healthcheck:
      test: ["CMD", "ozone", "admin", "om", "getServiceRoles"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    networks:
      - ozone-network

networks:
  ozone-network:
    driver: bridge
