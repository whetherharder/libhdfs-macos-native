name: Smoke test - Native library verification

on:
  workflow_call:
    inputs:
      hadoop_version:
        description: 'Hadoop version'
        type: string
        required: true
      should_build:
        description: 'Whether build ran (true) or artifacts from previous run (false)'
        type: string
        required: true

jobs:
  test:
    name: Smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel-x86_64
            runner: macos-15-intel
            arch_name: x86_64
          - arch: apple-silicon-arm64
            runner: macos-15
            arch_name: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: ${{ matrix.arch == 'apple-silicon-arm64' && 'aarch64' || 'x64' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download libhdfs artifacts (from current run)
        if: inputs.should_build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: libhdfs-${{ inputs.hadoop_version }}-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/libhdfs-native

      - name: Download libhdfs artifacts (from latest successful run)
        if: inputs.should_build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Downloading artifacts from latest successful run ==="

          WORKFLOW_NAME="orchestrator.yml"
          LATEST_RUN=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow="$WORKFLOW_NAME" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq='.[0].databaseId')

          if [ -z "$LATEST_RUN" ]; then
            echo "❌ No successful runs found"
            exit 1
          fi

          echo "Found successful run: $LATEST_RUN"

          mkdir -p $HOME/libhdfs-native

          gh run download $LATEST_RUN \
            --repo ${{ github.repository }} \
            --name "libhdfs-${{ inputs.hadoop_version }}-macos-${{ matrix.arch }}" \
            --dir $HOME/libhdfs-native

          if [ -f $HOME/libhdfs-native/libhdfs.dylib ]; then
            echo "✅ Artifact validated (libhdfs.dylib found)"
          else
            # Check if files are nested in subdirectory
            find $HOME/libhdfs-native -name "libhdfs.dylib" -type f
            echo "❌ libhdfs.dylib not found in expected location"
            exit 1
          fi

      - name: Prepare artifacts directory
        run: |
          # Normalize artifact location: download-artifact@v4 uses runner.temp,
          # gh run download uses $HOME/libhdfs-native
          if [ -d "${{ runner.temp }}/libhdfs-native" ]; then
            ARTIFACT_DIR="${{ runner.temp }}/libhdfs-native"
          else
            ARTIFACT_DIR="$HOME/libhdfs-native"
          fi

          # Find native libraries (may be in native/ subdirectory from artifact upload)
          if [ -f "$ARTIFACT_DIR/libhdfs.dylib" ]; then
            export LIBHDFS_DIR="$ARTIFACT_DIR"
          elif [ -f "$ARTIFACT_DIR/native/libhdfs.dylib" ]; then
            export LIBHDFS_DIR="$ARTIFACT_DIR/native"
          else
            # Search recursively
            FOUND=$(find "$ARTIFACT_DIR" -name "libhdfs.dylib" -type f | head -1)
            if [ -n "$FOUND" ]; then
              export LIBHDFS_DIR=$(dirname "$FOUND")
            else
              echo "❌ Cannot find libhdfs.dylib in artifact"
              find "$ARTIFACT_DIR" -type f
              exit 1
            fi
          fi

          echo "LIBHDFS_DIR=$LIBHDFS_DIR" >> $GITHUB_ENV
          echo "Libraries found in: $LIBHDFS_DIR"
          ls -lh "$LIBHDFS_DIR/"

      - name: Verify native libraries load correctly
        run: |
          echo "=== Smoke test: Native library loading ==="

          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          export DYLD_LIBRARY_PATH=$LIBHDFS_DIR:$JAVA_HOME/lib/server

          echo "Libraries:"
          ls -lh "$LIBHDFS_DIR/"

          echo ""
          echo "Architecture check:"
          file "$LIBHDFS_DIR/libhdfs.dylib"

          echo ""
          echo "Testing library loading..."
          python3 .github/tests/test_library_loading.py

          echo "✅ Smoke test passed - native libraries load correctly!"

      - name: Smoke test summary
        if: success()
        run: |
          echo "## ✅ Smoke Test Passed - ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Native libraries verified:" >> $GITHUB_STEP_SUMMARY
          echo "- Library loading successful" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: ${{ matrix.arch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- No JAR files or Ozone cluster required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** ~1-2 minutes" >> $GITHUB_STEP_SUMMARY
