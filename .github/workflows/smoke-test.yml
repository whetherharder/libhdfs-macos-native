name: Smoke test - Native library verification

on:
  workflow_call:
    inputs:
      hadoop_version:
        description: 'Hadoop version'
        type: string
        required: true
      should_build:
        description: 'Whether build ran (true) or artifacts from previous run (false)'
        type: string
        required: true

jobs:
  test:
    name: Smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: intel-x86_64
            runner: macos-15-intel
            arch_name: x86_64
          - arch: apple-silicon-arm64
            runner: macos-15
            arch_name: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download libhdfs artifacts (from current run)
        if: inputs.should_build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: libhdfs-${{ inputs.hadoop_version }}-macos-${{ matrix.arch }}
          path: ~/libhdfs-native

      - name: Download libhdfs artifacts (from latest run with artifacts)
        if: inputs.should_build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Downloading artifacts from latest run ==="

          WORKFLOW_NAME="orchestrator.yml"
          HADOOP_VERSION="${{ inputs.hadoop_version }}"
          ARTIFACT_NAME="libhdfs-${HADOOP_VERSION}-macos-${{ matrix.arch }}"

          # Get last 5 runs and find one with our artifact
          RECENT_RUNS=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow="$WORKFLOW_NAME" \
            --limit=5 \
            --json databaseId \
            --jq='.[].databaseId')

          if [ -z "$RECENT_RUNS" ]; then
            echo "❌ No workflow runs found"
            exit 1
          fi

          LATEST_RUN=""
          for RUN_ID in $RECENT_RUNS; do
            echo "Checking run $RUN_ID..."
            if gh run view $RUN_ID \
              --repo ${{ github.repository }} \
              --json artifacts \
              --jq '.artifacts[].name' 2>/dev/null | grep -q "$ARTIFACT_NAME"; then
              echo "✅ Found artifact in run $RUN_ID"
              LATEST_RUN="$RUN_ID"
              break
            fi
          done

          if [ -z "$LATEST_RUN" ]; then
            echo "❌ No runs with artifact $ARTIFACT_NAME found"
            exit 1
          fi

          mkdir -p ~/libhdfs-native
          gh run download $LATEST_RUN \
            --repo ${{ github.repository }} \
            --name "$ARTIFACT_NAME" \
            --dir ~/libhdfs-native

          echo "✅ Downloaded artifacts from run $LATEST_RUN"
          ls -la ~/libhdfs-native/

      - name: Verify native libraries load correctly
        run: |
          echo "=== Smoke test: Native library loading ==="

          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          export DYLD_LIBRARY_PATH=~/libhdfs-native:$JAVA_HOME/lib/server

          echo "Libraries:"
          ls -lh ~/libhdfs-native/

          echo ""
          echo "Architecture check:"
          file ~/libhdfs-native/libhdfs.dylib

          echo ""
          echo "Testing library loading..."
          python3 .github/tests/test_library_loading.py

          echo "✅ Smoke test passed - native libraries load correctly!"

      - name: Smoke test summary
        if: success()
        run: |
          echo "## ✅ Smoke Test Passed - ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Native libraries verified:" >> $GITHUB_STEP_SUMMARY
          echo "- Library loading successful" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: ${{ matrix.arch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- No JAR files or Ozone cluster required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** ~1-2 minutes" >> $GITHUB_STEP_SUMMARY
