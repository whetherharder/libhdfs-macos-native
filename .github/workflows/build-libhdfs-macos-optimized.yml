name: Build Hadoop libhdfs (Highly Optimized - Native Only)

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      hadoop_version:
        description: 'Hadoop version to build (e.g., 3.3.6)'
        required: false
        default: '3.3.6'
      skip_build:
        description: 'Skip build and run only integration tests (uses latest artifacts)'
        required: false
        type: boolean
        default: false
      run_integration_tests:
        description: 'Run full integration tests with Ozone (default: false, only smoke tests)'
        required: false
        type: boolean
        default: false

env:
  HADOOP_VERSION: ${{ github.event.inputs.hadoop_version || '3.3.6' }}
  PROTOBUF_VERSION: '3.21.12'
  JAVA_BUILD_VERSION: '11'
  JAVA_RUNTIME_VERSION: '17'

jobs:
  # ============================================
  # JOB 1: Setup Maven cache (runs once)
  # ============================================
  setup-maven:
    name: Setup Maven dependencies cache
    runs-on: macos-13
    if: github.event.inputs.skip_build != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Restore Maven cache
        id: cache-maven-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-optimized-hadoop-${{ env.HADOOP_VERSION }}-v3
          restore-keys: |
            ${{ runner.os }}-maven-optimized-hadoop-${{ env.HADOOP_VERSION }}-
            ${{ runner.os }}-maven-optimized-hadoop-
            ${{ runner.os }}-maven-optimized-

      - name: Download Maven dependencies and plugins
        if: steps.cache-maven-restore.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading ALL Maven dependencies and plugins for Hadoop ${{ env.HADOOP_VERSION }} ==="

          # Download Hadoop source
          cd $HOME
          if [ ! -d "hadoop-src" ]; then
            curl -L -o hadoop-${HADOOP_VERSION}-src.tar.gz \
              https://archive.apache.org/dist/hadoop/common/hadoop-${HADOOP_VERSION}/hadoop-${HADOOP_VERSION}-src.tar.gz
            tar -xzf hadoop-${HADOOP_VERSION}-src.tar.gz
            mv hadoop-${HADOOP_VERSION}-src hadoop-src
          fi

          cd $HOME/hadoop-src

          echo "=== Downloading plugins and dependencies for hadoop-common ==="
          # This will download all Maven plugins and dependencies used in build
          mvn dependency:go-offline -pl hadoop-common-project/hadoop-common -Pnative -B || true

          # Download plugins for the actual build phases we use
          mvn help:evaluate -Dexpression=project.version -pl hadoop-common-project/hadoop-common -B || true

          echo "=== Downloading plugins and dependencies for hadoop-hdfs-native-client ==="
          mvn dependency:go-offline -pl hadoop-hdfs-project/hadoop-hdfs-native-client -Pnative -B || true

          echo "✅ Maven dependencies and plugins downloaded"

      - name: Save Maven cache
        if: steps.cache-maven-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-optimized-hadoop-${{ env.HADOOP_VERSION }}-v3

  # ============================================
  # JOB 2: Build libhdfs (runs in parallel after setup-maven)
  # ============================================
  build-libhdfs:
    name: Build libhdfs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: setup-maven
    if: github.event.inputs.skip_build != 'true'

    strategy:
      matrix:
        include:
          - arch: intel-x86_64
            runner: macos-13
            arch_name: x86_64
          - arch: apple-silicon-arm64
            runner: macos-14
            arch_name: arm64

    steps:
      # ============================================
      # STEP 1: Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: Setup Java (minimal - only for native build)
      # ============================================
      - name: Setup Java 11 (for native compilation only)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: x64

      # ============================================
      # STEP 3: Install build dependencies
      # ============================================
      - name: Install build tools and libraries
        run: |
          echo "=== Installing build dependencies ==="
          brew install maven cmake autoconf automake libtool
          brew install openssl@3 snappy zlib lz4 zstd protobuf@21

      # ============================================
      # STEP 4: Verify Protocol Buffers installation
      # ============================================
      - name: Verify Protocol Buffers installation
        run: |
          echo "=== Verifying Protocol Buffers from brew ==="
          # protobuf@21 is keg-only, need to add to PATH
          # Use brew --prefix to support both Intel (/usr/local) and ARM64 (/opt/homebrew)
          PROTOBUF_PREFIX=$(brew --prefix protobuf@21)
          export PATH="$PROTOBUF_PREFIX/bin:$PATH"
          protoc --version
          echo "Protobuf libraries:"
          ls -la "$PROTOBUF_PREFIX/lib/" | grep libprotobuf
          echo "✅ Protocol Buffers installed via brew at $PROTOBUF_PREFIX"

          # Add to PATH for subsequent steps
          echo "$PROTOBUF_PREFIX/bin" >> $GITHUB_PATH

      # ============================================
      # STEP 5: Setup OpenSSL
      # ============================================
      - name: Setup OpenSSL symlinks
        run: |
          # Get Homebrew prefix (supports both Intel and ARM64)
          BREW_PREFIX=$(brew --prefix)
          OPENSSL_PREFIX=$(brew --prefix openssl@3)

          echo "Homebrew prefix: $BREW_PREFIX"
          echo "OpenSSL prefix: $OPENSSL_PREFIX"

          # Verify OpenSSL installation
          echo "=== Verifying OpenSSL installation ==="
          ls -la "$OPENSSL_PREFIX/include/" | head -10
          ls -la "$OPENSSL_PREFIX/lib/" | grep -E 'libssl|libcrypto'

          # Create symlinks for headers
          if [ ! -e "$BREW_PREFIX/include/openssl" ]; then
            cd "$BREW_PREFIX/include"
            sudo ln -sf "$OPENSSL_PREFIX/include/openssl" . || true
            echo "✅ Created header symlink: $BREW_PREFIX/include/openssl -> $OPENSSL_PREFIX/include/openssl"
          else
            echo "✅ Header symlink already exists: $BREW_PREFIX/include/openssl"
          fi

          # Create symlinks for libraries
          if [ ! -e "$BREW_PREFIX/lib/libssl.dylib" ]; then
            cd "$BREW_PREFIX/lib"
            sudo ln -sf "$OPENSSL_PREFIX/lib/libssl.3.dylib" libssl.dylib || true
            sudo ln -sf "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" libcrypto.dylib || true
            echo "✅ Created library symlinks in $BREW_PREFIX/lib"
          else
            echo "✅ Library symlinks already exist"
          fi

      # ============================================
      # STEP 6: Restore Maven cache (prepared by setup-maven job)
      # ============================================
      - name: Restore Maven dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-optimized-hadoop-${{ env.HADOOP_VERSION }}-v3
          restore-keys: |
            ${{ runner.os }}-maven-optimized-hadoop-${{ env.HADOOP_VERSION }}-
            ${{ runner.os }}-maven-optimized-hadoop-
            ${{ runner.os }}-maven-optimized-

      # ============================================
      # STEP 7: Cache Hadoop source
      # ============================================
      - name: Cache Hadoop source
        id: cache-hadoop-src
        uses: actions/cache@v4
        with:
          path: ~/hadoop-src
          key: hadoop-src-${{ env.HADOOP_VERSION }}-${{ matrix.arch }}-v2

      # ============================================
      # STEP 8: Clone Hadoop source (for native code only)
      # ============================================
      - name: Clone Hadoop repository (shallow - for native code only)
        if: steps.cache-hadoop-src.outputs.cache-hit != 'true'
        run: |
          echo "=== Cloning Hadoop ${HADOOP_VERSION} (shallow) ==="
          echo "We only need the native C/C++ source code, not Java sources!"

          git clone --depth 1 --branch rel/release-${HADOOP_VERSION} \
            --single-branch \
            https://github.com/apache/hadoop.git $HOME/hadoop-src

          cd $HOME/hadoop-src
          echo "Hadoop version: $(grep '<version>' pom.xml | head -1)"

      # ============================================
      # STEP 9: Apply patches
      # ============================================
      - name: Apply macOS compatibility patches
        run: |
          cd $HOME/hadoop-src

          # Fix cmake_minimum_required in hadoop-common
          CMAKE_FILE="hadoop-common-project/hadoop-common/src/CMakeLists.txt"
          sed -i.bak 's/cmake_minimum_required(VERSION 3.1/cmake_minimum_required(VERSION 3.5/' "$CMAKE_FILE"
          echo "✅ Updated cmake_minimum_required to VERSION 3.5"

          # Apply OpenSSL patch
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-macos-openssl.cmake"
          LINE_NUM=$(grep -n "include(HadoopJNI)" "$CMAKE_FILE" | head -1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            LINE_NUM=$(grep -n "cmake_minimum_required" "$CMAKE_FILE" | head -1 | cut -d: -f1)
          fi
          sed "${LINE_NUM}r ${PATCH_FILE}" "$CMAKE_FILE" > "${CMAKE_FILE}.patched"
          mv "${CMAKE_FILE}.patched" "$CMAKE_FILE"
          echo "✅ CMake OpenSSL patch applied"

          # Apply exception.c patch for macOS
          EXCEPTION_PATCH="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-exception-macos.patch"
          patch -p1 < "$EXCEPTION_PATCH"
          echo "✅ exception.c patch applied"

          # Apply OpenSSL 3.x compatibility patch
          OPENSSL_PATCH="${GITHUB_WORKSPACE}/.github/patches/hadoop-3.3.6-openssl3-compat.patch"
          patch -p1 < "$OPENSSL_PATCH"
          echo "✅ OpenSSL 3.x compatibility patch applied"

          # Fix cmake_minimum_required in ALL HDFS CMakeLists.txt files (including root)
          echo "=== Fixing CMake version in HDFS native client (all CMakeLists.txt) ==="

          # Find all CMakeLists.txt files and update cmake_minimum_required to 3.5
          find hadoop-hdfs-project/hadoop-hdfs-native-client -name "CMakeLists.txt" | \
          while read -r cmake_file; do
            if grep -q "cmake_minimum_required" "$cmake_file"; then
              echo "Updating $cmake_file"
              # Show before
              echo "  Before: $(grep cmake_minimum_required "$cmake_file" | head -1)"
              # Replace any cmake_minimum_required with VERSION < 3.5
              # Use -E for extended regex on macOS (+ instead of \+)
              sed -i.bak -E 's/cmake_minimum_required\(VERSION [0-9]+\.[0-9]+/cmake_minimum_required(VERSION 3.5/' "$cmake_file"
              # Show after
              echo "  After:  $(grep cmake_minimum_required "$cmake_file" | head -1)"
              # Verify change
              if ! grep -q "cmake_minimum_required(VERSION 3.5" "$cmake_file"; then
                echo "  ⚠️  WARNING: Failed to update $cmake_file"
                # Try to show what went wrong
                echo "  Content: $(cat "$cmake_file" | grep -A2 -B2 cmake_minimum_required)"
              fi
            fi
          done

          echo "=== Verifying all cmake_minimum_required updates ==="
          find hadoop-hdfs-project/hadoop-hdfs-native-client -name "CMakeLists.txt" -exec grep -H "cmake_minimum_required" {} \;

          echo "✅ Updated all HDFS cmake_minimum_required to VERSION 3.5"

      # ============================================
      # STEP 10: Build ONLY native libraries (NO Java compilation!)
      # ============================================
      - name: Build native libraries only (skip all Java compilation)
        run: |
          set -e
          set -o pipefail

          cd $HOME/hadoop-src
          echo "=== Building ONLY native libraries ==="
          echo "No JAR downloads - pure native build!"

          # Get Homebrew prefixes (supports both Intel and ARM64)
          BREW_PREFIX=$(brew --prefix)
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          PROTOBUF_PREFIX=$(brew --prefix protobuf@21)

          # Compression libraries - use Homebrew for all
          SNAPPY_PREFIX=$(brew --prefix snappy 2>/dev/null || echo "$BREW_PREFIX")
          LZ4_PREFIX=$(brew --prefix lz4 2>/dev/null || echo "$BREW_PREFIX")
          ZSTD_PREFIX=$(brew --prefix zstd 2>/dev/null || echo "$BREW_PREFIX")

          # ZLIB - always use Homebrew version for consistent paths
          ZLIB_PREFIX=$(brew --prefix zlib 2>/dev/null || echo "")
          if [ -z "$ZLIB_PREFIX" ]; then
            echo "⚠️  zlib not found in Homebrew, using system zlib may cause issues"
            # Try to use system zlib via Xcode SDK paths
            ZLIB_PREFIX=$(xcrun --show-sdk-path 2>/dev/null || echo "/usr")
          fi

          echo "Homebrew prefix: $BREW_PREFIX"
          echo "OpenSSL prefix: $OPENSSL_PREFIX"
          echo "Protobuf prefix: $PROTOBUF_PREFIX"
          echo "Snappy prefix: $SNAPPY_PREFIX"
          echo "LZ4 prefix: $LZ4_PREFIX"
          echo "Zstd prefix: $ZSTD_PREFIX"
          echo "Zlib prefix: $ZLIB_PREFIX"

          # Setup environment
          export OPENSSL_ROOT_DIR=$OPENSSL_PREFIX
          export OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include
          export OPENSSL_LIBRARIES=$OPENSSL_PREFIX/lib

          # ZLIB configuration for CMake - use actual Homebrew paths
          if [[ "$ZLIB_PREFIX" == *"/opt/homebrew"* ]] || [[ "$ZLIB_PREFIX" == *"/usr/local"* ]]; then
            # Homebrew zlib
            export ZLIB_ROOT=$ZLIB_PREFIX
            export ZLIB_INCLUDE_DIR=$ZLIB_PREFIX/include
            export ZLIB_LIBRARY=$ZLIB_PREFIX/lib/libz.dylib
            echo "Using Homebrew zlib:"
            echo "  ZLIB_ROOT=$ZLIB_ROOT"
            echo "  ZLIB_INCLUDE_DIR=$ZLIB_INCLUDE_DIR"
            echo "  ZLIB_LIBRARY=$ZLIB_LIBRARY"
            ls -la "$ZLIB_LIBRARY" 2>/dev/null || echo "  ⚠️  ZLIB_LIBRARY not found!"
          else
            # System zlib via SDK
            export ZLIB_ROOT=$ZLIB_PREFIX
            export ZLIB_INCLUDE_DIR=$ZLIB_PREFIX/usr/include
            echo "Using system zlib via SDK:"
            echo "  ZLIB_ROOT=$ZLIB_ROOT"
            echo "  ZLIB_INCLUDE_DIR=$ZLIB_INCLUDE_DIR"
            echo "  Note: ZLIB_LIBRARY will be auto-detected by CMake"
          fi

          # Add all compression libraries to PKG_CONFIG_PATH
          export PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$PROTOBUF_PREFIX/lib/pkgconfig:$SNAPPY_PREFIX/lib/pkgconfig:$LZ4_PREFIX/lib/pkgconfig:$ZSTD_PREFIX/lib/pkgconfig

          export PROTOBUF_HOME=$PROTOBUF_PREFIX
          export CMAKE_PREFIX_PATH=$OPENSSL_PREFIX:$PROTOBUF_PREFIX:$SNAPPY_PREFIX:$LZ4_PREFIX:$ZSTD_PREFIX:$ZLIB_PREFIX:$BREW_PREFIX
          export Protobuf_ROOT=$PROTOBUF_PREFIX

          # Compiler flags for all keg-only libraries
          if [[ "$ZLIB_PREFIX" == *"/opt/homebrew"* ]] || [[ "$ZLIB_PREFIX" == *"/usr/local"* ]]; then
            # Include Homebrew zlib in flags
            export LDFLAGS="-L$PROTOBUF_PREFIX/lib -L$SNAPPY_PREFIX/lib -L$LZ4_PREFIX/lib -L$ZSTD_PREFIX/lib -L$ZLIB_PREFIX/lib"
            export CPPFLAGS="-I$PROTOBUF_PREFIX/include -I$SNAPPY_PREFIX/include -I$LZ4_PREFIX/include -I$ZSTD_PREFIX/include -I$ZLIB_PREFIX/include"
          else
            # System zlib, don't add to flags (CMake will find it)
            export LDFLAGS="-L$PROTOBUF_PREFIX/lib -L$SNAPPY_PREFIX/lib -L$LZ4_PREFIX/lib -L$ZSTD_PREFIX/lib"
            export CPPFLAGS="-I$PROTOBUF_PREFIX/include -I$SNAPPY_PREFIX/include -I$LZ4_PREFIX/include -I$ZSTD_PREFIX/include"
          fi

          # Build hadoop-common native ONLY (skip Java compilation entirely)
          echo "=== Building hadoop-common native libraries ==="
          mvn clean install -pl hadoop-common-project/hadoop-common \
            -Pnative \
            -DskipTests \
            -Dmaven.compiler.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            -Drat.skip=true \
            -Drequire.openssl=true \
            -Dopenssl.prefix=$OPENSSL_PREFIX \
            -Dbundle.openssl=false \
            -Drequire.libwebhdfs=false \
            -Drequire.fuse=false \
            -Drequire.valgrind=false \
            -Drequire.snappy=true \
            -Drequire.zstd=true \
            -Drequire.test.libhdfs=false \
            2>&1 | tee build-common.log || true

          # If maven.compiler.skip breaks the build, use compile but skip surefire
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ maven.compiler.skip didn't work, trying alternative approach..."

            # Alternative: compile minimally but skip tests and other phases
            mvn clean install -pl hadoop-common-project/hadoop-common \
              -Pnative \
              -DskipTests \
              -Dmaven.test.skip=true \
              -Dsurefire.skip=true \
              -Dmaven.javadoc.skip=true \
              -Dmaven.source.skip=true \
              -Drat.skip=true \
              -Dcheckstyle.skip=true \
              -Dfindbugs.skip=true \
              -Drequire.openssl=true \
              -Dopenssl.prefix=$OPENSSL_PREFIX \
              -Dbundle.openssl=false \
              -Drequire.libwebhdfs=false \
              -Drequire.fuse=false \
              -Drequire.valgrind=false \
              -Drequire.snappy=true \
              -Drequire.zstd=true \
              -Drequire.test.libhdfs=false \
              2>&1 | tee build-common.log

            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "❌ hadoop-common build FAILED"
              exit 1
            fi
          fi

          echo "✅ hadoop-common native built successfully"

          # Build HDFS native client (libhdfs)
          echo "=== Building hadoop-hdfs native libraries ==="
          mvn install -pl hadoop-hdfs-project/hadoop-hdfs-native-client \
            -am \
            -Pnative \
            -DskipTests \
            -Dmaven.test.skip=true \
            -Dsurefire.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            -Drat.skip=true \
            -Dcheckstyle.skip=true \
            -Dfindbugs.skip=true \
            -Drequire.openssl=true \
            -Dopenssl.prefix=$OPENSSL_PREFIX \
            -Dbundle.openssl=false \
            -Drequire.libwebhdfs=false \
            -Drequire.fuse=false \
            -Drequire.valgrind=false \
            -Drequire.test.libhdfs=false \
            2>&1 | tee build-hdfs.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ hadoop-hdfs-native-client build FAILED"
            exit 1
          fi

          echo "✅ libhdfs built successfully"

      # ============================================
      # STEP 11: Collect artifacts (native libraries and headers only)
      # ============================================
      - name: Collect libhdfs artifacts
        run: |
          echo "=== Collecting libhdfs artifacts (native only) ==="

          mkdir -p $HOME/libhdfs-artifacts/native
          mkdir -p $HOME/libhdfs-artifacts/headers

          # Copy native libraries
          if [ -d $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib ]; then
            cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib/*.dylib \
               $HOME/libhdfs-artifacts/native/ 2>/dev/null || true
            cp $HOME/hadoop-src/hadoop-common-project/hadoop-common/target/native/target/usr/local/lib/*.a \
               $HOME/libhdfs-artifacts/native/ 2>/dev/null || true
          fi

          if [ -d $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/lib ]; then
            cp $HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/lib/libhdfs.* \
               $HOME/libhdfs-artifacts/native/
          fi

          # Copy headers
          echo "=== Looking for headers ==="

          # Try multiple possible locations
          HEADER_LOCATIONS=(
            "$HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/target/native/target/usr/local/include"
            "$HOME/hadoop-src/hadoop-hdfs-project/hadoop-hdfs-native-client/src/main/native/libhdfs"
            "$HOME/hadoop-src/hadoop-common-project/hadoop-common/src/main/native/src/org/apache/hadoop/io/nativeio"
          )

          for location in "${HEADER_LOCATIONS[@]}"; do
            echo "Checking: $location"
            if [ -d "$location" ]; then
              echo "  Found headers in: $location"
              find "$location" -name "*.h" -exec cp {} $HOME/libhdfs-artifacts/headers/ \;
            fi
          done

          echo "Headers collected:"
          ls -la $HOME/libhdfs-artifacts/headers/

          echo "=== Artifacts collected (native libraries only) ==="
          echo "Native libraries:"
          ls -lh $HOME/libhdfs-artifacts/native/
          echo ""
          echo "Headers:"
          ls -lh $HOME/libhdfs-artifacts/headers/

      # ============================================
      # STEP 12: Verify libhdfs
      # ============================================
      - name: Verify libhdfs artifacts
        run: |
          echo "=== Verifying libhdfs artifacts ==="

          cd $HOME/libhdfs-artifacts/native

          if [ ! -f "libhdfs.dylib" ]; then
            echo "ERROR: libhdfs.dylib not found!"
            exit 1
          fi

          echo "✅ libhdfs.dylib found"
          ls -lh libhdfs.dylib

          if [ ! -f "libhadoop.dylib" ] && [ ! -f "libhadoop.a" ]; then
            echo "ERROR: libhadoop not found!"
            exit 1
          fi

          echo "✅ libhadoop found"

          echo "=== Architecture check ==="
          file libhdfs.dylib

          if ! file libhdfs.dylib | grep -q "${{ matrix.arch_name }}"; then
            echo "ERROR: Wrong architecture!"
            exit 1
          fi

          echo "✅ Architecture: ${{ matrix.arch_name }}"

          echo "=== Dependencies ==="
          otool -L libhdfs.dylib

      # ============================================
      # STEP 13: Create package (native libraries only)
      # ============================================
      - name: Create libhdfs package
        run: |
          cd $HOME/libhdfs-artifacts

          # Use BUILD_INFO template from repository
          cp ${GITHUB_WORKSPACE}/.github/templates/BUILD_INFO.txt.template BUILD_INFO.txt
          # macOS sed requires backup extension argument (use empty string for no backup)
          sed -i '' "s/{{HADOOP_VERSION}}/${HADOOP_VERSION}/g" BUILD_INFO.txt
          sed -i '' "s/{{BUILD_DATE}}/$(date -u +"%Y-%m-%d %H:%M:%S UTC")/g" BUILD_INFO.txt
          sed -i '' "s/{{ARCH}}/${{ matrix.arch }}/g" BUILD_INFO.txt
          sed -i '' "s/{{ARCH_NAME}}/${{ matrix.arch_name }}/g" BUILD_INFO.txt
          sed -i '' "s/{{JAVA_BUILD_VERSION}}/${JAVA_BUILD_VERSION}/g" BUILD_INFO.txt
          sed -i '' "s/{{JAVA_RUNTIME_VERSION}}/${JAVA_RUNTIME_VERSION}/g" BUILD_INFO.txt
          sed -i '' "s/{{PROTOBUF_VERSION}}/${PROTOBUF_VERSION}/g" BUILD_INFO.txt
          sed -i '' "s/{{GITHUB_RUN}}/${{ github.run_number }}/g" BUILD_INFO.txt

          tar -czf libhdfs-${HADOOP_VERSION}-macos-${{ matrix.arch }}-optimized.tar.gz \
            native/ headers/ BUILD_INFO.txt

          shasum -a 256 libhdfs-${HADOOP_VERSION}-macos-${{ matrix.arch }}-optimized.tar.gz > \
            libhdfs-${HADOOP_VERSION}-macos-${{ matrix.arch }}-optimized.tar.gz.sha256

          echo "=== Package created (native libraries only) ==="
          ls -lh *.tar.gz*

      # ============================================
      # STEP 15: Upload artifacts (native libraries only)
      # ============================================
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: libhdfs-${{ env.HADOOP_VERSION }}-macos-${{ matrix.arch }}
          path: ~/libhdfs-artifacts/native/
          retention-days: 90

      # ============================================
      # STEP 16: Summary
      # ============================================
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ libhdfs Build Successful (Optimized) - ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Optimization" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Native libraries built from source with compression support" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Skipped Java compilation and JAR downloads" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cached Hadoop source for faster subsequent builds" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Significantly faster build time" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Hadoop Version:** ${{ env.HADOOP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** macOS ${{ matrix.arch }} (${{ matrix.arch_name }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Compression:** Snappy, LZ4, Zstd, Zlib" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Native Libraries Artifact" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact name:** \`libhdfs-${{ env.HADOOP_VERSION }}-macos-${{ matrix.arch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Contains:" >> $GITHUB_STEP_SUMMARY
          echo "- \`libhdfs.dylib\` / \`libhdfs.a\` - HDFS C API library" >> $GITHUB_STEP_SUMMARY
          echo "- \`libhadoop.dylib\` / \`libhadoop.a\` - Hadoop native library" >> $GITHUB_STEP_SUMMARY
          echo "- Headers (\`*.h\`) for C/C++ development" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** JAR files excluded from artifacts. Download separately from Maven Central if needed." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 3: Smoke test - fast native library verification (always runs)
  # ============================================
  smoke-test:
    name: Smoke test - Native library verification (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-libhdfs
    if: always() && needs.build-libhdfs.result == 'success'

    strategy:
      matrix:
        include:
          - arch: intel-x86_64
            runner: macos-13
            arch_name: x86_64
          - arch: apple-silicon-arm64
            runner: macos-14
            arch_name: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download libhdfs artifacts
        uses: actions/download-artifact@v4
        with:
          name: libhdfs-${{ env.HADOOP_VERSION }}-macos-${{ matrix.arch }}
          path: ~/libhdfs-native

      - name: Verify native libraries load correctly
        run: |
          echo "=== Smoke test: Native library loading ==="

          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          export DYLD_LIBRARY_PATH=~/libhdfs-native:$JAVA_HOME/lib/server

          echo "Libraries:"
          ls -lh ~/libhdfs-native/

          echo ""
          echo "Architecture check:"
          file ~/libhdfs-native/libhdfs.dylib

          echo ""
          echo "Testing library loading..."
          python3 .github/tests/test_library_loading.py

          echo "✅ Smoke test passed - native libraries load correctly!"

      - name: Smoke test summary
        if: success()
        run: |
          echo "## ✅ Smoke Test Passed - ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Native libraries verified:" >> $GITHUB_STEP_SUMMARY
          echo "- Library loading successful" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: ${{ matrix.arch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- No JAR files or Ozone cluster required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** ~1-2 minutes" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 4: Integration tests with PyArrow (optional, manual trigger or main branch)
  # ============================================
  integration-tests:
    name: Integration tests with PyArrow (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-libhdfs
    if: |
      always() &&
      (needs.build-libhdfs.result == 'success' || github.event.inputs.skip_build == 'true') &&
      (github.event.inputs.run_integration_tests == 'true' || github.ref == 'refs/heads/main')

    strategy:
      matrix:
        include:
          - arch: intel-x86_64
            runner: macos-13
            arch_name: x86_64
          - arch: apple-silicon-arm64
            runner: macos-14
            arch_name: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          architecture: x64

      - name: Download libhdfs artifacts (from current run)
        if: github.event.inputs.skip_build != 'true'
        uses: actions/download-artifact@v4
        with:
          name: libhdfs-${{ env.HADOOP_VERSION }}-macos-${{ matrix.arch }}
          path: ~/libhdfs-artifacts/native

      - name: Download libhdfs artifacts (from latest successful run)
        if: github.event.inputs.skip_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Downloading artifacts from latest successful run ==="

          # Find latest successful workflow run
          WORKFLOW_NAME="build-libhdfs-macos-optimized.yml"
          LATEST_RUN=$(gh run list --workflow="$WORKFLOW_NAME" --status=success --limit=1 --json databaseId --jq='.[0].databaseId')

          if [ -z "$LATEST_RUN" ]; then
            echo "❌ No successful runs found"
            exit 1
          fi

          echo "Found successful run: $LATEST_RUN"

          # Download artifact
          mkdir -p ~/libhdfs-artifacts
          gh run download $LATEST_RUN --name "libhdfs-${{ env.HADOOP_VERSION }}-macos-${{ matrix.arch }}" --dir ~/libhdfs-artifacts/native

          echo "✅ Artifacts downloaded"
          ls -la ~/libhdfs-artifacts/native/

      - name: Download Hadoop JARs for integration tests
        run: |
          echo "=== Downloading Hadoop JARs for integration tests ==="

          mkdir -p ~/libhdfs-artifacts/jars
          cd ~/libhdfs-artifacts/jars

          # Use pom.xml template from repository
          cp ${GITHUB_WORKSPACE}/.github/templates/pom-download-jars.xml.template pom.xml
          # macOS sed requires backup extension argument (use empty string for no backup)
          sed -i '' "s/{{HADOOP_VERSION}}/${HADOOP_VERSION}/g" pom.xml

          # Download JARs with dependencies
          mvn dependency:copy-dependencies -DoutputDirectory=. -DincludeScope=runtime

          echo "✅ Hadoop JARs downloaded"
          echo "Downloaded $(ls -1 *.jar | wc -l) JAR files"

      - name: Basic libhdfs test (library loading only)
        run: |
          echo "=== Basic library loading test ==="

          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          export DYLD_LIBRARY_PATH=~/libhdfs-artifacts/native:$JAVA_HOME/lib/server

          python3 .github/tests/test_library_loading.py

          echo "✅ Basic library loading test completed"

      - name: Start Ozone with Docker Compose
        run: |
          echo "=== Starting Ozone mini cluster with Docker Compose ==="

          cd ${GITHUB_WORKSPACE}/.github/templates

          # Start Ozone in background
          docker-compose -f ozone-docker-compose.yml up -d

          echo "=== Waiting for Ozone to be healthy ==="
          # Wait for healthcheck to pass (max 60 seconds)
          OZONE_READY=false
          for i in {1..60}; do
            if docker-compose -f ozone-docker-compose.yml ps | grep -q "healthy"; then
              echo "✅ Ozone ready in $i seconds!"
              OZONE_READY=true
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 1
          done

          if [ "$OZONE_READY" = false ]; then
            echo "⚠️  Ozone did not become healthy within 60 seconds"
            echo "=== Docker logs ==="
            docker-compose -f ozone-docker-compose.yml logs
            exit 1
          fi

          echo "=== Ozone status ==="
          docker-compose -f ozone-docker-compose.yml ps

      - name: Install Python dependencies
        run: |
          pip3 install pyarrow pandas

      - name: Run PyArrow integration tests
        run: |
          export HADOOP_HOME=~/libhdfs-artifacts
          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          export DYLD_LIBRARY_PATH=$HADOOP_HOME/native:$JAVA_HOME/lib/server
          export HDFS_HOST=localhost
          export HDFS_PORT=9862

          python3 .github/tests/test_libhdfs_pyarrow.py || {
            echo "=== Ozone OM logs ==="
            cat /tmp/ozone/om.log || true
            echo "=== Ozone SCM logs ==="
            cat /tmp/ozone/scm.log || true
            exit 1
          }

      - name: Cleanup Ozone
        if: always()
        run: |
          cd ${GITHUB_WORKSPACE}/.github/templates
          docker-compose -f ozone-docker-compose.yml down -v || true
          docker-compose -f ozone-docker-compose.yml rm -f || true
