name: Check if build is needed

on:
  workflow_call:
    inputs:
      hadoop_version:
        description: 'Hadoop version to build'
        type: string
        required: true
      force_build:
        description: 'Force full build even if only tests/docs changed'
        type: boolean
        required: false
        default: false
      skip_build:
        description: 'Skip build and use latest artifacts'
        type: boolean
        required: false
        default: false
      event_name:
        description: 'Event that triggered the workflow (push/pull_request/workflow_dispatch)'
        type: string
        required: true
    outputs:
      should_build:
        description: 'Whether build should run (true/false)'
        value: ${{ jobs.check.outputs.should_build }}

jobs:
  check:
    name: Analyze changes and artifacts
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if build is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build Decision Logic ==="

          # Priority 0: force_build=true → always build
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 0: force_build=true - building"
            exit 0
          fi

          # Priority 1: skip_build=true → skip build
          if [ "${{ inputs.skip_build }}" = "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "✅ Priority 1: skip_build=true - skipping build"
            exit 0
          fi

          # Priority 2: Manual trigger → always build
          if [ "${{ inputs.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 2: Manual trigger - building"
            exit 0
          fi

          # Priority 3: Check changed files
          echo "=== Checking changed files ==="

          # Try to get changed files, fallback to force build if git history is incomplete
          if ! git diff --name-only HEAD^ HEAD > changed_files.txt 2>/dev/null; then
            echo "⚠️  Cannot determine changed files (shallow clone or first commit)"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Forcing build due to incomplete git history"
            exit 0
          fi

          # If no files changed (empty diff), force build
          if [ ! -s changed_files.txt ]; then
            echo "⚠️  No changed files detected"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Forcing build due to empty diff"
            exit 0
          fi

          echo "Changed files:"
          cat changed_files.txt

          # Pattern matching: files that don't require rebuild (test scripts, test configs, docs only)
          TEST_ONLY_PATTERN="^(\.github/(tests/|templates/ozone-docker-compose\.yml)|CLAUDE\.md|README\.md)"

          # Workflow categorization:
          # Build-affecting workflows (ALWAYS require rebuild)
          BUILD_AFFECTING_WORKFLOWS="^\.github/workflows/(build-libhdfs|setup-maven)\.yml"

          # Non-build-affecting workflows (can skip rebuild if artifacts exist)
          NON_BUILD_AFFECTING_WORKFLOWS="^\.github/workflows/(check-changes|smoke-test|integration-test|ozone-integration-tests|orchestrator)\.yml"

          # Check if build-affecting workflows changed
          if grep -E "$BUILD_AFFECTING_WORKFLOWS" changed_files.txt; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 3: Build-affecting workflow changed (build-libhdfs.yml or setup-maven.yml) - building"
            exit 0
          fi

          # Check if patches changed
          if grep "^\.github/patches/" changed_files.txt; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 3: Patches changed - building"
            exit 0
          fi

          # Check if non-test, non-doc, non-workflow files changed (source code, etc.)
          # Use intermediate variable to avoid pipefail issues
          OTHER_FILES=$(grep -vE "$TEST_ONLY_PATTERN" changed_files.txt 2>/dev/null | grep -vE "$NON_BUILD_AFFECTING_WORKFLOWS" 2>/dev/null || true)
          if [ -n "$OTHER_FILES" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 3: Source code or other files changed - building"
            echo "Files triggering build: $OTHER_FILES"
            exit 0
          fi

          # Only test/docs/non-build-affecting workflows changed → check artifacts

          # Priority 4: Only test/docs changed - check if artifacts exist
          echo "=== Priority 4: Only test/docs changed - checking artifacts ==="

          WORKFLOW_NAME="orchestrator.yml"
          HADOOP_VERSION="${{ inputs.hadoop_version }}"

          # Search last 10 successful runs for one that has build artifacts
          # (a successful run may have skipped the build, so we need to check multiple)
          echo "Searching last 10 successful runs for artifacts..."
          SUCCESSFUL_RUNS=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow="$WORKFLOW_NAME" \
            --status=success \
            --limit=10 \
            --json databaseId \
            --jq='.[].databaseId' 2>/dev/null || echo "")

          if [ -z "$SUCCESSFUL_RUNS" ]; then
            echo "⚠️  No successful runs found - forcing build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST_RUN=""
          for RUN_ID in $SUCCESSFUL_RUNS; do
            ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts --jq '.artifacts[].name' 2>/dev/null || echo "")

            INTEL_FOUND=$(echo "$ARTIFACTS" | grep -c "libhdfs-.*-macos-intel" || true)
            ARM_FOUND=$(echo "$ARTIFACTS" | grep -c "libhdfs-.*-macos-apple" || true)

            if [ "$INTEL_FOUND" -gt 0 ] && [ "$ARM_FOUND" -gt 0 ]; then
              echo "Found run with both artifacts: $RUN_ID"
              LATEST_RUN="$RUN_ID"
              break
            else
              echo "Run $RUN_ID: missing artifacts (intel=$INTEL_FOUND, arm=$ARM_FOUND), checking next..."
            fi
          done

          if [ -z "$LATEST_RUN" ]; then
            echo "⚠️  No recent successful run with artifacts found - forcing build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Using run with artifacts: $LATEST_RUN"

          # Verify artifacts match the expected Hadoop version
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$LATEST_RUN/artifacts \
            --jq '.artifacts[].name') || {
              echo "⚠️  Failed to fetch artifacts from run $LATEST_RUN"
              ARTIFACTS=""
            }

          echo "Available artifacts:"
          echo "$ARTIFACTS"

          # Check for Intel artifact with correct version
          if ! echo "$ARTIFACTS" | grep -q "libhdfs-${HADOOP_VERSION}-macos-intel-x86_64"; then
            echo "⚠️  Intel artifact for version ${HADOOP_VERSION} not found - forcing build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for ARM64 artifact with correct version
          if ! echo "$ARTIFACTS" | grep -q "libhdfs-${HADOOP_VERSION}-macos-apple-silicon-arm64"; then
            echo "⚠️  ARM64 artifact for version ${HADOOP_VERSION} not found - forcing build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Both artifacts found in run $LATEST_RUN - skipping build, will reuse artifacts"
          echo "should_build=false" >> $GITHUB_OUTPUT
